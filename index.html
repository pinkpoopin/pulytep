<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CU-TEP Vocab">
<meta name="theme-color" content="#F1F3F7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<title>CU-TEP Vocab Drill — เกมฝึกคำศัพท์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F3F7; --card:#FFFFFF; --ink:#171A21; --graphite:#7A808F; --rule:#DDE1E9;
    --pink:#E4467C; --pink-soft:#FCE2EC; --green:#12735C; --red:#C62B3F;
    --shadow:0 1px 0 rgba(23,26,33,.06), 0 8px 24px -16px rgba(23,26,33,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    background-image:linear-gradient(var(--rule) 1px,transparent 1px);
    background-size:100% 28px;
    color:var(--ink);
    font-family:"IBM Plex Sans Thai","Anuphan",system-ui,sans-serif;
    font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
    padding:20px 14px 56px;
  }
  .wrap{max-width:660px;margin:0 auto}
  .masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:14px}
  .brand{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase}
  .brand b{color:var(--pink);font-weight:600}
  .brand-sub{font-family:"Anuphan",sans-serif;font-size:13px;color:var(--graphite);letter-spacing:0;text-transform:none;font-weight:400;margin-top:2px}
  .sheet-no{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--graphite);letter-spacing:.1em;text-align:right}

  .sheet{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:3px;box-shadow:var(--shadow);padding:22px 20px 20px}
  .sheet::before,.sheet::after{content:"";position:absolute;width:9px;height:9px;background:var(--ink)}
  .sheet::before{top:8px;left:8px}
  .sheet::after{top:8px;right:8px}
  .mark-bl,.mark-br{position:absolute;width:9px;height:9px;background:var(--ink);bottom:8px}
  .mark-bl{left:8px}.mark-br{right:8px}
  .ticks{position:absolute;left:8px;top:34px;bottom:34px;width:5px;display:flex;flex-direction:column;justify-content:space-between}
  .ticks i{display:block;height:2px;background:var(--rule)}
  .sheet-inner{padding-left:16px;padding-right:6px}

  h1{font-family:"Anuphan",sans-serif;font-weight:700;font-size:clamp(24px,5.6vw,32px);line-height:1.25;margin:0 0 6px;letter-spacing:-.01em}
  .lede{color:var(--graphite);font-size:14.5px;margin:0 0 22px;max-width:48ch}
  .field{margin-bottom:20px}
  .field-label{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--graphite);display:block;margin-bottom:9px}

  .opts{display:flex;flex-direction:column;gap:7px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:11px 13px;font:inherit;color:var(--ink);cursor:pointer;transition:border-color .12s,background .12s}
  .opt:hover:not(:disabled){border-color:var(--pink);background:#fffafc}
  .opt:disabled{cursor:default}
  .opt:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
  .bub{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--graphite);display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:500;color:var(--graphite);transition:.14s}
  .opt .label{flex:1;min-width:0}
  .opt .note{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--graphite)}
  .opt.sel .bub,.opt[aria-pressed="true"] .bub{background:var(--ink);border-color:var(--ink);color:#fff;background-image:repeating-linear-gradient(52deg,rgba(255,255,255,.16) 0 1px,transparent 1px 3px)}
  .opt.sel,.opt[aria-pressed="true"]{border-color:var(--ink)}
  .opt.correct{border-color:var(--green);background:#F2FAF7}
  .opt.correct .bub{background:var(--green);border-color:var(--green);color:#fff;background-image:repeating-linear-gradient(52deg,rgba(255,255,255,.16) 0 1px,transparent 1px 3px)}
  .opt.wrong{border-color:var(--red);background:#FDF3F4}
  .opt.wrong .bub{background:var(--red);border-color:var(--red);color:#fff}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:"Anuphan",sans-serif;font-weight:600;font-size:15px;padding:12px 22px;border-radius:3px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;transition:.12s}
  .btn:hover{background:var(--pink);border-color:var(--pink)}
  .btn:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
  .btn.ghost:hover{border-color:var(--ink);background:transparent;color:var(--ink)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .btn-row{display:flex;flex-wrap:wrap;gap:9px;margin-top:4px}

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{font-family:"IBM Plex Mono",monospace;font-size:12.5px;padding:7px 13px;border:1px solid var(--rule);border-radius:999px;background:var(--card);cursor:pointer;color:var(--graphite);transition:.12s}
  .chip:hover{border-color:var(--pink);color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--pink-soft);border-color:var(--pink);color:var(--pink);font-weight:500}
  .chip:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

  select{font-family:"IBM Plex Sans Thai",sans-serif;font-size:14.5px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:10px 12px;width:100%;cursor:pointer;appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--graphite) 50%),linear-gradient(135deg,var(--graphite) 50%,transparent 50%);
    background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  select:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

  .statusbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:16px}
  .metrics{display:flex;gap:18px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;color:var(--graphite);text-transform:uppercase}
  .metrics b{display:block;font-size:18px;letter-spacing:0;color:var(--ink);font-weight:600;line-height:1.2}
  .metrics .hot b{color:var(--pink)}
  .strip{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
  .pip{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--rule);flex:none}
  .pip.ok{background:var(--green);border-color:var(--green)}
  .pip.no{background:var(--red);border-color:var(--red)}
  .pip.now{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink-soft)}
  .timer{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin-bottom:18px}
  .timer i{display:block;height:100%;background:var(--pink);width:100%}
  .timer.warn i{background:var(--red)}

  .qtype{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--pink);margin-bottom:10px}
  .prompt-word{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:clamp(30px,7.5vw,44px);letter-spacing:-.02em;line-height:1.15;margin:0 0 4px;word-break:break-word}
  .prompt-th{font-family:"Anuphan",sans-serif;font-weight:600;font-size:clamp(24px,6vw,34px);line-height:1.3;margin:0 0 4px}
  .pos{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--graphite);margin-bottom:20px}
  .pron{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 20px;padding:9px 12px;border:1px solid var(--rule);border-left:3px solid var(--pink);border-radius:3px;background:#FDFAFB}
  .pron .ipa{font-family:"IBM Plex Mono",monospace;font-size:16px;color:var(--ink)}
  .pron .thai{font-family:"Anuphan",sans-serif;font-size:15px;color:var(--graphite)}
  .say{flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--pink);background:var(--card);color:var(--pink);display:grid;place-items:center;cursor:pointer;padding:0;transition:.12s}
  .say:hover{background:var(--pink);color:#fff}
  .say:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
  .say svg{width:15px;height:15px;fill:currentColor}
  .fb-pron{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--graphite);margin-top:4px}
  .prompt-sent{font-size:18px;line-height:1.75;margin:0 0 22px}
  .prompt-sent u{text-decoration:none;border-bottom:2px solid var(--pink);padding:0 22px;display:inline-block}

  .typebox{display:flex;gap:8px;align-items:stretch;margin-bottom:4px}
  .typebox input{flex:1;min-width:0;font-family:"IBM Plex Mono",monospace;font-size:20px;padding:12px 14px;border:1px solid var(--rule);border-bottom:2px solid var(--ink);border-radius:3px;background:#FAFBFD;color:var(--ink)}
  .typebox input:focus{outline:none;border-bottom-color:var(--pink);background:#fff}
  .typebox input:disabled{color:var(--graphite)}
  .type-hint{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--graphite);margin-top:8px}

  .feedback{margin-top:18px;padding:14px 15px;border:1px solid var(--rule);border-left:3px solid var(--ink);border-radius:3px;background:#FAFBFD;font-size:14.5px}
  .feedback.good{border-left-color:var(--green)}
  .feedback.bad{border-left-color:var(--red)}
  .fb-head{font-family:"Anuphan",sans-serif;font-weight:600;margin-bottom:6px}
  .fb-head.good{color:var(--green)}
  .fb-head.bad{color:var(--red)}
  .fb-word{font-family:"IBM Plex Mono",monospace;font-weight:500}
  .fb-line{color:var(--graphite);font-size:13.5px;margin-top:4px}
  .fb-line em{font-style:normal;color:var(--ink)}

  .score-big{font-family:"IBM Plex Mono",monospace;font-size:clamp(48px,13vw,76px);font-weight:600;line-height:1;letter-spacing:-.03em;margin:2px 0}
  .score-sub{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--graphite);letter-spacing:.1em;text-transform:uppercase;margin-bottom:22px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin-bottom:24px}
  .grid3 div{background:var(--card);padding:13px 12px}
  .grid3 span{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite)}
  .grid3 b{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600}
  .missed{list-style:none;padding:0;margin:0 0 24px;border-top:1px solid var(--rule)}
  .missed li{padding:11px 2px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  .missed .w{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:15px;min-width:140px}
  .missed .m{color:var(--graphite);font-size:14px}

  .hint{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--graphite);margin-top:10px;letter-spacing:.03em}
  .warnline{font-size:13.5px;color:var(--red);margin-top:10px}
  .hide{display:none !important}
  @media (max-width:520px){
    .sheet{padding:20px 12px 18px}
    .sheet-inner{padding-left:12px;padding-right:0}
    .metrics{gap:12px}
    .missed .w{min-width:100%}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div>
      <div class="brand">CU-TEP <b>VOCAB</b> DRILL</div>
      <div class="brand-sub" id="bankLine">คลังศัพท์วิชาการ</div>
    </div>
    <div class="sheet-no" id="sheetNo">FORM 01</div>
  </div>

  <div class="sheet">
    <span class="mark-bl"></span><span class="mark-br"></span>
    <div class="ticks" id="ticks"></div>
    <div class="sheet-inner">

      <!-- ============ START ============ -->
      <section id="screenStart">
        <h1>ฝนคำตอบให้ถูก ก่อนถึงวันสอบจริง</h1>
        <p class="lede" id="lede"></p>

        <div class="field">
          <span class="field-label">รูปแบบคำถาม</span>
          <div class="opts" id="modeOpts">
            <button class="opt" data-mode="mixed" aria-pressed="true"><span class="bub">A</span><span class="label">สลับทุกรูปแบบ <span class="note">แนะนำ</span></span></button>
            <button class="opt" data-mode="meaning" aria-pressed="false"><span class="bub">B</span><span class="label">ศัพท์ → ความหมายไทย <span class="note">มีคำอ่าน + เสียง</span></span></button>
            <button class="opt" data-mode="reverse" aria-pressed="false"><span class="bub">C</span><span class="label">ความหมายไทย → ศัพท์</span></button>
            <button class="opt" data-mode="typing" aria-pressed="false"><span class="bub">D</span><span class="label">พิมพ์คำศัพท์เอง <span class="note">ฝึกสะกด</span></span></button>
            <button class="opt" data-mode="synonym" aria-pressed="false"><span class="bub">E</span><span class="label">คำที่ใกล้เคียงที่สุด <span class="note">แบบ Reading</span></span></button>
            <button class="opt" data-mode="cloze" aria-pressed="false"><span class="bub">F</span><span class="label">เติมคำในประโยค</span></button>
          </div>
          <div class="hint" id="modeNote"></div>
        </div>

        <div class="field">
          <span class="field-label">ขอบเขตคำศัพท์</span>
          <select id="scopeSel"></select>
          <div class="hint" id="scopeNote"></div>
        </div>

        <div class="field">
          <span class="field-label">จำนวนข้อ</span>
          <div class="chips" id="lenChips">
            <button class="chip" data-len="10" aria-pressed="true">10 ข้อ</button>
            <button class="chip" data-len="20" aria-pressed="false">20 ข้อ</button>
            <button class="chip" data-len="30" aria-pressed="false">30 ข้อ</button>
            <button class="chip" data-len="50" aria-pressed="false">50 ข้อ</button>
          </div>
        </div>

        <div class="field">
          <span class="field-label">ตัวเลือกเพิ่มเติม</span>
          <div class="chips">
            <button class="chip" id="timerChip" aria-pressed="true">จับเวลา 20 วิ/ข้อ</button>
            <button class="chip" id="weakChip" aria-pressed="false">เฉพาะคำที่เคยตอบผิด</button>
          </div>
          <div class="hint" id="weakCount"></div>
        </div>

        <div class="btn-row">
          <button class="btn" id="startBtn">เริ่มทำข้อสอบ</button>
          <button class="btn ghost" id="resetBtn">ล้างสถิติ</button>
        </div>
        <div class="hint" id="lifetime"></div>
        <div class="warnline hide" id="poolWarn"></div>
      </section>

      <!-- ============ PLAY ============ -->
      <section id="screenPlay" class="hide">
        <div class="statusbar">
          <div class="metrics">
            <div><span>ข้อ</span><b id="mNum">1/10</b></div>
            <div><span>คะแนน</span><b id="mScore">0</b></div>
            <div class="hot"><span>ต่อเนื่อง</span><b id="mStreak">0</b></div>
          </div>
          <button class="btn ghost" id="quitBtn" style="padding:7px 13px;font-size:13px">ออก</button>
        </div>
        <div class="strip" id="strip"></div>
        <div class="timer" id="timerBar"><i></i></div>
        <div class="qtype" id="qType"></div>
        <div id="promptBox"></div>
        <div class="opts" id="answerOpts"></div>
        <div id="feedback"></div>
        <div class="btn-row" id="nextRow" style="display:none">
          <button class="btn" id="nextBtn">ข้อถัดไป</button>
        </div>
        <div class="hint" id="keyHint"></div>
      </section>

      <!-- ============ RESULT ============ -->
      <section id="screenResult" class="hide">
        <div class="qtype">ผลการทำข้อสอบ</div>
        <div class="score-big" id="rScore">0</div>
        <div class="score-sub" id="rVerdict">คะแนนรวม</div>
        <div class="grid3">
          <div><span>ถูก</span><b id="rCorrect">0</b></div>
          <div><span>ความแม่นยำ</span><b id="rAcc">0%</b></div>
          <div><span>ต่อเนื่องสูงสุด</span><b id="rStreak">0</b></div>
        </div>
        <div id="missedBox">
          <span class="field-label">คำที่ต้องกลับมาทบทวน</span>
          <ul class="missed" id="missedList"></ul>
        </div>
        <div class="btn-row">
          <button class="btn" id="againBtn">ทำชุดใหม่</button>
          <button class="btn ghost" id="drillBtn">ฝึกเฉพาะคำที่ผิด</button>
          <button class="btn ghost" id="homeBtn">กลับหน้าแรก</button>
        </div>
      </section>

    </div>
  </div>
</div>

<script>
/* =====================================================================
   คลังคำศัพท์
   ---------------------------------------------------------------------
   BANK_FULL  = คำที่มีข้อมูลครบ เล่นได้ทุกโหมด
       รูปแบบ: คำ|ชนิดคำ|ความหมายไทย|นิยามอังกฤษ|คำเหมือน|กลุ่มความหมาย|ประโยค (ใช้ ___ แทนช่องว่าง)
   BANK_BASIC = คำที่มีเฉพาะความหมาย เล่นได้โหมด B, C, D
       รูปแบบ: คำ|ชนิดคำ|ความหมายไทย
   "กลุ่มความหมาย" ใส่เมื่อคำนั้นแปลใกล้กับคำอื่น เพื่อกันไม่ให้ถูกสุ่มมาเป็นตัวเลือกในข้อเดียวกัน (เว้นว่างได้)
   ===================================================================== */
const BANK_FULL = `
abandon|v|ละทิ้ง ทอดทิ้ง|to leave or give up completely|forsake|stop|Rescuers had to ___ the search after nightfall.
abound|v|มีอยู่ดาษดื่น มีอย่างล้นเหลือ|to exist in very large numbers|teem|many|Fish ___ in the shallow waters around the reef.
abstract|adj|เป็นนามธรรม จับต้องไม่ได้|based on ideas rather than physical things|theoretical||Justice is an ___ concept that resists simple definition.
abundant|adj|มีอยู่มากมาย อุดมสมบูรณ์|existing in large quantities|plentiful||Rainfall is ___ in the tropics, so irrigation is rarely necessary.
academic|adj|ทางวิชาการ|relating to education, study or scholarship|scholarly||Her ___ record won her a place at three universities.
accelerate|v|เร่งให้เร็วขึ้น|to increase in speed or rate|hasten||Rising temperatures ___ the melting of glaciers.
access|n/v|เข้าถึง|the right or means to reach or use something|entry||Rural clinics still lack reliable ___ to electricity.
accommodate|v|รองรับ จัดที่ให้|to provide space or adapt to needs|house||The new terminal can ___ forty million passengers a year.
accompany|v|ไปเป็นเพื่อน/ประกอบกับ|to go along with, or to occur together with|escort||Fever may ___ the rash in the first two days.
accumulate|v|สะสมพอกพูน|to gather an increasing amount over time|amass||Sediment continues to ___ at the mouth of the river.
accurate|adj|แม่นยำ|correct in every detail|exact|exact|Early maps were rarely ___ about distances at sea.
achieve|v|บรรลุ|to succeed in reaching a goal|accomplish|get|Few countries will ___ the emissions target on time.
acknowledge|v|ยอมรับ รับรู้|to admit that something is true|admit||The report failed to ___ the scale of the problem.
acquire|v|ได้มา ครอบครอง|to come to possess something|obtain|get|Children ___ a second language most easily before puberty.
acute|adj|รุนแรงเฉียบพลัน, แหลมคม|severe and sudden, or very perceptive|severe||The region faces an ___ shortage of midwives.
adapt|v|ปรับตัวให้เข้ากับ|to change to suit new conditions|adjust|change|Species that cannot ___ to warming seas will disappear.

/* ---------------- pool ---------------- */
function basePool(){
  let pool=WORDS;
  if(S.scope==="full") pool=pool.filter(w=>w.full);
  else if(S.scope==="itp") pool=pool.filter(w=>ITP[w.w]);
  else if(S.scope.startsWith("itp:")){
    const g=S.scope.slice(4);
    pool=pool.filter(w=>ITP[w.w]&&ITP[w.w].includes(g));
  }
  else if(S.scope.startsWith("set:")){
    const i=+S.scope.slice(4);
    pool=SORTED.slice(i*SET_SIZE,(i+1)*SET_SIZE);
  }
  if(S.mode==="synonym"||S.mode==="cloze") pool=pool.filter(w=>w.full);
  if(S.weakOnly){
    const ws=new Set(Object.keys(weak));
    const f=pool.filter(w=>ws.has(w.w));
    if(f.length>=4) pool=f;
  }
  return pool;
}
function refreshNotes(){
  const n=basePool().length;
  $("#modeNote").textContent = ((S.mode==="synonym"||S.mode==="cloze") && FULL_COUNT<WORDS.length)

}

/* ---------------- question builder ---------------- */
function thTokens(s){return s.split(/[\s,/()]+/).filter(t=>t.length>1);}
function clash(a,b){
  if(a.g&&b.g&&a.g===b.g) return true;
  const t=new Set(thTokens(a.th));
  return thTokens(b.th).some(x=>t.has(x));
}
function distractors(word,key,n){
  const lw=word.w.toLowerCase(), ls=(word.syn||"").toLowerCase();
  const pool=WORDS.filter(x=>{
    if(x.w===word.w || !x[key] || x[key]===word[key] || clash(x,word)) return false;
    // กันตัวลวงที่กลายเป็นคำตอบถูกไปด้วย เช่น โจทย์ attach แล้วมีตัวเลือก attach
    if(key==="syn" && (x.syn||"").toLowerCase()===lw) return false;
    if(key==="w" && x.w.toLowerCase()===ls) return false;
    return true;
  });
  const out=[],used=new Set();
  for(const c of shuffle(pool)){
    if(used.has(c[key])) continue;
    used.add(c[key]); out.push(c);
    if(out.length===n) break;
  }
  return out;
}
function typesFor(w){
  const t=["meaning","reverse","typing"];
  if(w.full) t.push("synonym","cloze");
  return t;
}
function makeQuestion(word,mode){
  let type=mode;
  if(mode==="mixed"){const t=typesFor(word);type=t[Math.random()*t.length|0];}
  if(type==="typing") return {word,type};
  const key = type==="meaning" ? "th" : type==="synonym" ? "syn" : "w";
  const opts=shuffle([word,...distractors(word,key,3)]).map(o=>({text:o[key],ok:o.w===word.w}));
  return {word,type,opts};
}
function buildQueue(){
  const pool=basePool();
  const need=Math.min(S.len,pool.length);
  return shuffle(pool).slice(0,need).map(w=>makeQuestion(w,S.mode));
}

/* ---------------- flow ---------------- */
function show(id){
  ["screenStart","screenPlay","screenResult"].forEach(s=>$("#"+s).classList.toggle("hide",s!==id));
  window.scrollTo({top:0,behavior:"smooth"});
}
function startRound(queue){
  S.queue=queue||buildQueue();
  if(!S.queue.length) return;
  S.i=0;S.score=0;S.streak=0;S.bestStreak=0;S.correct=0;S.missed=[];
  $("#timerBar").style.display=S.timed?"":"none";
  show("screenPlay");renderQuestion();
}
function bindSay(root){
  root.querySelectorAll("[data-say]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();speak(b.dataset.say);}));
}
function renderStrip(){
  $("#strip").innerHTML=S.queue.map((q,idx)=>{
    let c="pip";
    if(q.result==="ok")c+=" ok";else if(q.result==="no")c+=" no";
    if(idx===S.i)c+=" now";
    return `<span class="${c}"></span>`;
  }).join("");
}
const TYPE_LABEL={meaning:"ความหมายของคำ",reverse:"เลือกศัพท์ให้ตรงความหมาย",typing:"พิมพ์คำศัพท์",synonym:"คำที่ใกล้เคียงที่สุด",cloze:"เติมคำในประโยค"};

function renderQuestion(){
  const q=S.queue[S.i];S.locked=false;
  $("#mNum").textContent=`${S.i+1}/${S.queue.length}`;
  $("#mScore").textContent=S.score;
  $("#mStreak").textContent=S.streak;
  $("#qType").textContent=TYPE_LABEL[q.type];
  renderStrip();

  const w=q.word;
  let prompt="";
  if(q.type==="cloze") prompt=`<p class="prompt-sent">${esc(w.sent).replace("___","<u></u>")}</p>`;
  else if(q.type==="meaning")
    prompt=`<h2 class="prompt-word">${esc(w.w)}</h2><div class="pos" style="margin-bottom:8px">${esc(w.pos)}.${w.def?" &nbsp;"+esc(w.def):""}</div>${pronBlock(w)}`;
  else if(q.type==="synonym")
    prompt=`<h2 class="prompt-word">${esc(w.w)}</h2><div class="pos">${esc(w.pos)}.${w.def?" &nbsp;"+esc(w.def):""}</div>`;
  else prompt=`<h2 class="prompt-th">${esc(w.th)}</h2><div class="pos">${esc(w.pos)}.</div>`;
  $("#promptBox").innerHTML=prompt;
  bindSay($("#promptBox"));

  if(q.type==="typing"){
    $("#answerOpts").innerHTML=`<div class="typebox">
        <input id="typeIn" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="พิมพ์คำศัพท์ภาษาอังกฤษ">
        <button class="btn" id="typeGo">ตรวจ</button>
      </div><div class="type-hint">ขึ้นต้นด้วย "${esc(w.w[0])}" · ${w.w.length} ตัวอักษร</div>`;
    $("#typeGo").addEventListener("click",()=>answer($("#typeIn").value));
    $("#typeIn").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();answer($("#typeIn").value);}});
    setTimeout(()=>$("#typeIn")&&$("#typeIn").focus(),50);
    $("#keyHint").textContent="พิมพ์คำตอบแล้วกด Enter";
  }else{
    $("#answerOpts").innerHTML=q.opts.map((o,idx)=>
      `<button class="opt" data-idx="${idx}"><span class="bub">${"ABCD"[idx]}</span><span class="label">${esc(o.text)}</span></button>`).join("");
    document.querySelectorAll("#answerOpts .opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.idx)));
    $("#keyHint").textContent="กด 1–4 เพื่อเลือกคำตอบ · P ฟังเสียงอ่าน · Enter ไปข้อถัดไป";
  }

  $("#feedback").innerHTML="";$("#nextRow").style.display="none";
  if(S.timed) startTimer(); else stopTimer();
}
function startTimer(){
  stopTimer();S.left=20;
  const bar=$("#timerBar"),fill=bar.querySelector("i");
  bar.classList.remove("warn");fill.style.transition="none";fill.style.width="100%";
  requestAnimationFrame(()=>{fill.style.transition="width 1s linear";});
  S.t=setInterval(()=>{
    S.left--;fill.style.width=(S.left/20*100)+"%";
    if(S.left<=5) bar.classList.add("warn");
    if(S.left<=0){stopTimer();answer(-1);}
  },1000);
}
function stopTimer(){if(S.t){clearInterval(S.t);S.t=null;}}
function norm(s){return String(s).toLowerCase().trim().replace(/[-\s.]/g,"").replace(/ise$/,"ize").replace(/isation$/,"ization");}

function answer(input){
  if(S.locked) return;
  S.locked=true;stopTimer();
  const q=S.queue[S.i],w=q.word;
  let ok=false,timedOut=(input===-1);

  if(q.type==="typing"){
    ok = !timedOut && norm(input)===norm(w.w);
    const inp=$("#typeIn");
    if(inp){inp.disabled=true;inp.style.borderBottomColor=ok?"var(--green)":"var(--red)";}
    const go=$("#typeGo"); if(go) go.disabled=true;
  }else{
    ok = !timedOut && q.opts[input] && q.opts[input].ok;
    document.querySelectorAll("#answerOpts .opt").forEach((b,i)=>{
      b.disabled=true;
      if(q.opts[i].ok) b.classList.add("correct");
      else if(i===input) b.classList.add("wrong");
    });
  }
  q.result=ok?"ok":"no";

  if(ok){
    S.correct++;S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);
    S.score+=100+Math.min(S.streak,5)*20+(S.timed?S.left*5:0);
    if(weak[w.w]){weak[w.w]--;if(weak[w.w]<=0)delete weak[w.w];}
  }else{
    S.streak=0;S.missed.push(w);weak[w.w]=(weak[w.w]||0)+1;
  }
  stats.answered++;if(ok)stats.correct++;stats.best=Math.max(stats.best,S.bestStreak);
  $("#mScore").textContent=S.score;$("#mStreak").textContent=S.streak;renderStrip();

  const head = timedOut?`<div class="fb-head bad">หมดเวลา</div>`
             : ok?`<div class="fb-head good">ถูกต้อง</div>`
                 :`<div class="fb-head bad">ยังไม่ใช่</div>`;
  const p=PRON[w.w];
  const pronLine = p?`<div class="fb-pron">${esc(p.ipa)} &nbsp;·&nbsp; ${esc(p.th)}${CAN_SPEAK?` <button class="say" data-say="${esc(w.w)}" style="width:24px;height:24px;vertical-align:middle;margin-left:6px" aria-label="ฟังเสียงอ่าน">${SPK}</button>`:""}</div>`:"";
  const extra = w.full
    ? `<div class="fb-line">คำใกล้เคียง: <em>${esc(w.syn)}</em></div>
       <div class="fb-line">${esc(w.sent).replace("___","<em>"+esc(w.w)+"</em>")}</div>`
    : (w.def?`<div class="fb-line">${esc(w.def)}</div>`:"");
  $("#feedback").innerHTML=`<div class="feedback ${ok?"good":"bad"}">
      ${head}
      <div><span class="fb-word">${esc(w.w)}</span> <span style="color:var(--graphite)">(${esc(w.pos)}.)</span> — ${esc(w.th)}</div>
      ${pronLine}
      ${extra}
    </div>`;
  bindSay($("#feedback"));
  $("#nextRow").style.display="flex";
  $("#nextBtn").textContent=S.i+1>=S.queue.length?"ดูผลคะแนน":"ข้อถัดไป";
  $("#nextBtn").focus();
}
$("#nextBtn").addEventListener("click",()=>{
  if(S.i+1>=S.queue.length) finish(); else {S.i++;renderQuestion();}
});
$("#quitBtn").addEventListener("click",()=>{stopTimer();persist();show("screenStart");renderHome();});
async function persist(){await store.set("cutep:stats",stats);await store.set("cutep:weak",weak);}

async function finish(){
  stopTimer();stats.sessions++;await persist();
  const acc=Math.round(S.correct/S.queue.length*100);
  $("#rScore").textContent=S.score;
  $("#rVerdict").textContent=acc>=90?"แม่นมาก พร้อมสอบ":acc>=70?"ดีแล้ว เก็บอีกนิด":acc>=50?"ต้องทบทวนเพิ่ม":"กลับไปดูศัพท์อีกรอบ";
  $("#rCorrect").textContent=`${S.correct}/${S.queue.length}`;
  $("#rAcc").textContent=acc+"%";
  $("#rStreak").textContent=S.bestStreak;
  if(S.missed.length){
    $("#missedBox").classList.remove("hide");
    $("#missedList").innerHTML=S.missed.map(w=>
      `<li><span class="w">${esc(w.w)}</span><span class="m">${esc(w.th)}${w.syn?" · "+esc(w.syn):""}</span></li>`).join("");
  }else $("#missedBox").classList.add("hide");
  $("#drillBtn").disabled=S.missed.length===0;
  show("screenResult");
}
$("#againBtn").addEventListener("click",()=>startRound());
$("#drillBtn").addEventListener("click",()=>startRound(shuffle(S.missed.slice()).map(w=>makeQuestion(w,S.mode))));
$("#homeBtn").addEventListener("click",()=>{show("screenStart");renderHome();});

document.addEventListener("keydown",e=>{
  if($("#screenPlay").classList.contains("hide")) return;
  const q=S.queue[S.i];
  if(!S.locked && q && q.type!=="typing" && ["1","2","3","4"].includes(e.key)){answer(+e.key-1);e.preventDefault();}
  if(S.locked && (e.key==="Enter"||e.key===" ")){$("#nextBtn").click();e.preventDefault();}
  if((e.key==="p"||e.key==="P") && q && document.activeElement.id!=="typeIn"){speak(q.word.w);}
});

/* ---------------- boot ---------------- */
async function boot(){
  stats=(await store.get("cutep:stats"))||stats;
  weak=(await store.get("cutep:weak"))||weak;
  renderHome();
}
function renderHome(){
  const n=Object.keys(weak).length;
  $("#weakCount").textContent=n?`มีคำที่เคยตอบผิดอยู่ ${n} คำ`:"ยังไม่มีคำที่ตอบผิดในคลังทบทวน";
  $("#lifetime").textContent=stats.answered
    ?`สะสม: ตอบไปแล้ว ${stats.answered} ข้อ · ถูก ${Math.round(stats.correct/stats.answered*100)}% · ต่อเนื่องสูงสุด ${stats.best}`:"";
  $("#sheetNo").textContent="FORM "+String((stats.sessions||0)+1).padStart(2,"0");
  refreshNotes();
}
boot();
</script>
